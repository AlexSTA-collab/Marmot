[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ijes-interface-reproducibility"
version = "2026.11"
description = "Job files, scorer and figure scripts of \"An inelastic imperfect interface model derived from the underlying interphase\" (IJES, revision November 2026)"
requires-python = ">=3.10"

[project.scripts]
ijes = "ijes.cli:main"

[tool.setuptools.packages.find]
include = ["ijes*"]
