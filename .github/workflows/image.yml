name: image
# Build the solver image from the Dockerfile and publish it as ghcr.io/<owner>/<repository>:<tag> (on the Marmot fork:
# ghcr.io/alexsta-collab/marmot:ijes-reproducibility-<date>). Runs on tags of the ijes-reproducibility branch only.
on:
  push:
    tags: ["ijes-reproducibility-*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space (the environment is ~4 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            ${{ steps.name.outputs.image }}:latest
      - name: "Smoke test: solver, plug-ins and one elastic case"
        run: |
          docker run --rm ${{ steps.name.outputs.image }}:latest bash -c '
            python -c "import edelweissfe; print(edelweissfe.__file__)" &&
            ls /opt/marmot/plugins && ijes list | head -5'
